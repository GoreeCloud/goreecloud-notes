name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile backend
        run: python -m compileall -q app migrations

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare sanitized CI configuration
        run: |
          cp .env.example .env
          mkdir -p secrets
          printf '%s\n' 'ci-only-postgres-password' > secrets/postgres_password
          sudo chgrp 20001 secrets/postgres_password
          chmod 600 .env
          chmod 640 secrets/postgres_password

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start development stack
        run: docker compose up --detach --build

      - name: Validate database migration round trip
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check
          docker compose run --rm api alembic downgrade base
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check

      - name: Validate live API and PostgreSQL readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready > /tmp/goreecloud-notes-ready.json; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "GoreeCloud Notes did not become ready." >&2
              exit 1
            fi

            sleep 2
          done

          grep -F '"status":"ready"' /tmp/goreecloud-notes-ready.json
          curl --fail --silent --show-error http://127.0.0.1:8000/health | grep -F '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/meta | grep -F '"product":"GoreeCloud Notes"'

      - name: Validate private authentication and CSRF flow
        run: |
          printf '%s\n' 'ci-only-auth-password-12345' | \
            docker compose exec -T api python -m app.cli create-user \
              --username ci-user \
              --display-name 'CI User' \
              --password-stdin

          login_status=$(curl \
            --silent \
            --show-error \
            --cookie-jar /tmp/goreecloud-notes-cookies.txt \
            --output /tmp/goreecloud-notes-login.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"username":"ci-user","password":"ci-only-auth-password-12345"}' \
            http://127.0.0.1:8000/api/v1/auth/login)
          test "$login_status" = "200"
          grep -F '"username":"ci-user"' /tmp/goreecloud-notes-login.json

          csrf_token=$(awk '$6 == "goreecloud_notes_csrf" { print $7 }' /tmp/goreecloud-notes-cookies.txt)
          test -n "$csrf_token"

          curl \
            --fail \
            --silent \
            --show-error \
            --cookie /tmp/goreecloud-notes-cookies.txt \
            http://127.0.0.1:8000/api/v1/auth/me | grep -F '"username":"ci-user"'

          no_csrf_status=$(curl \
            --silent \
            --show-error \
            --cookie /tmp/goreecloud-notes-cookies.txt \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request POST \
            http://127.0.0.1:8000/api/v1/auth/logout)
          test "$no_csrf_status" = "403"

          logout_status=$(curl \
            --silent \
            --show-error \
            --cookie /tmp/goreecloud-notes-cookies.txt \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "X-CSRF-Token: $csrf_token" \
            --request POST \
            http://127.0.0.1:8000/api/v1/auth/logout)
          test "$logout_status" = "204"

          revoked_status=$(curl \
            --silent \
            --show-error \
            --cookie /tmp/goreecloud-notes-cookies.txt \
            --output /dev/null \
            --write-out '%{http_code}' \
            http://127.0.0.1:8000/api/v1/auth/me)
          test "$revoked_status" = "401"

      - name: Validate authenticated workspace ownership and revisions
        run: |
          printf '%s\n' 'ci-owner-password-12345' | \
            docker compose exec -T api python -m app.cli create-user \
              --username workspace-owner \
              --display-name 'Workspace Owner' \
              --password-stdin
          printf '%s\n' 'ci-other-password-12345' | \
            docker compose exec -T api python -m app.cli create-user \
              --username workspace-other \
              --display-name 'Workspace Other' \
              --password-stdin

          curl \
            --fail \
            --silent \
            --show-error \
            --cookie-jar /tmp/owner-cookies.txt \
            --header 'Content-Type: application/json' \
            --data '{"username":"workspace-owner","password":"ci-owner-password-12345"}' \
            http://127.0.0.1:8000/api/v1/auth/login > /tmp/owner-login.json
          owner_csrf=$(awk '$6 == "goreecloud_notes_csrf" { print $7 }' /tmp/owner-cookies.txt)
          test -n "$owner_csrf"

          curl \
            --fail \
            --silent \
            --show-error \
            --cookie /tmp/owner-cookies.txt \
            --header "X-CSRF-Token: $owner_csrf" \
            --header 'Content-Type: application/json' \
            --data '{"name":"Owner Notebook"}' \
            http://127.0.0.1:8000/api/v1/notebooks > /tmp/owner-notebook.json
          notebook_id=$(python -c 'import json; print(json.load(open("/tmp/owner-notebook.json"))["id"])')
          test -n "$notebook_id"

          curl \
            --fail \
            --silent \
            --show-error \
            --cookie /tmp/owner-cookies.txt \
            --header "X-CSRF-Token: $owner_csrf" \
            --header 'Content-Type: application/json' \
            --data "{\"title\":\"Owner Original Note\",\"notebook_id\":\"$notebook_id\",\"document\":{\"format\":\"goreecloud.blocks\",\"version\":1,\"blocks\":[{\"type\":\"paragraph\",\"text\":\"Original body\"}]}}" \
            http://127.0.0.1:8000/api/v1/notes > /tmp/owner-note.json
          note_id=$(python -c 'import json; print(json.load(open("/tmp/owner-note.json"))["id"])')
          test -n "$note_id"

          curl \
            --fail \
            --silent \
            --show-error \
            --cookie /tmp/owner-cookies.txt \
            --header "X-CSRF-Token: $owner_csrf" \
            --header 'Content-Type: application/json' \
            --request PATCH \
            --data '{"title":"Owner Updated Note","document":{"format":"goreecloud.blocks","version":1,"blocks":[{"type":"paragraph","text":"Updated body"}]}}' \
            http://127.0.0.1:8000/api/v1/notes/$note_id > /tmp/owner-updated-note.json
          grep -F '"title":"Owner Updated Note"' /tmp/owner-updated-note.json

          curl \
            --fail \
            --silent \
            --show-error \
            --cookie /tmp/owner-cookies.txt \
            http://127.0.0.1:8000/api/v1/notes/$note_id/revisions > /tmp/owner-revisions.json
          grep -F '"revision_number":1' /tmp/owner-revisions.json
          grep -F '"title":"Owner Original Note"' /tmp/owner-revisions.json

          curl \
            --fail \
            --silent \
            --show-error \
            --cookie-jar /tmp/other-cookies.txt \
            --header 'Content-Type: application/json' \
            --data '{"username":"workspace-other","password":"ci-other-password-12345"}' \
            http://127.0.0.1:8000/api/v1/auth/login > /tmp/other-login.json
          other_csrf=$(awk '$6 == "goreecloud_notes_csrf" { print $7 }' /tmp/other-cookies.txt)
          test -n "$other_csrf"

          other_get_status=$(curl \
            --silent \
            --show-error \
            --cookie /tmp/other-cookies.txt \
            --output /dev/null \
            --write-out '%{http_code}' \
            http://127.0.0.1:8000/api/v1/notes/$note_id)
          test "$other_get_status" = "404"

          other_patch_status=$(curl \
            --silent \
            --show-error \
            --cookie /tmp/other-cookies.txt \
            --header "X-CSRF-Token: $other_csrf" \
            --header 'Content-Type: application/json' \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request PATCH \
            --data '{"title":"Cross-user overwrite attempt"}' \
            http://127.0.0.1:8000/api/v1/notes/$note_id)
          test "$other_patch_status" = "404"

          other_notebook_status=$(curl \
            --silent \
            --show-error \
            --cookie /tmp/other-cookies.txt \
            --header "X-CSRF-Token: $other_csrf" \
            --header 'Content-Type: application/json' \
            --output /dev/null \
            --write-out '%{http_code}' \
            --data "{\"title\":\"Cross-user notebook attempt\",\"notebook_id\":\"$notebook_id\"}" \
            http://127.0.0.1:8000/api/v1/notes)
          test "$other_notebook_status" = "404"

          curl \
            --fail \
            --silent \
            --show-error \
            --cookie /tmp/other-cookies.txt \
            http://127.0.0.1:8000/api/v1/notes > /tmp/other-notes.json
          ! grep -F 'Owner Updated Note' /tmp/other-notes.json

          trash_status=$(curl \
            --silent \
            --show-error \
            --cookie /tmp/owner-cookies.txt \
            --header "X-CSRF-Token: $owner_csrf" \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request DELETE \
            http://127.0.0.1:8000/api/v1/notes/$note_id)
          test "$trash_status" = "204"

          curl \
            --fail \
            --silent \
            --show-error \
            --cookie /tmp/owner-cookies.txt \
            'http://127.0.0.1:8000/api/v1/notes?state=trashed' > /tmp/owner-trash.json
          grep -F '"title":"Owner Updated Note"' /tmp/owner-trash.json

      - name: Capture Compose diagnostics
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Clean up Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
