name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install locked backend dependencies
        run: |
          python -m pip install --constraint requirements.lock -e ".[test]"
          python -m pip check

      - name: Verify complete backend dependency lock
        run: |
          python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version
          from pathlib import Path

          locked = {}
          for raw_line in Path('requirements.lock').read_text(encoding='utf-8').splitlines():
              line = raw_line.strip()
              if not line or line.startswith('#'):
                  continue
              if '==' not in line:
                  raise SystemExit(f'Unlocked requirement in requirements.lock: {line}')
              name, expected = line.split('==', 1)
              normalized = name.strip().lower().replace('_', '-').replace('.', '-')
              if normalized in locked:
                  raise SystemExit(f'Duplicate locked distribution: {name}')
              locked[normalized] = expected.strip()

          missing = []
          mismatched = []
          for name, expected in sorted(locked.items()):
              try:
                  actual = version(name)
              except PackageNotFoundError:
                  missing.append(name)
                  continue
              if actual != expected:
                  mismatched.append((name, expected, actual))

          if missing or mismatched:
              raise SystemExit(f'Backend dependency lock mismatch: missing={missing}, mismatched={mismatched}')
          print(f'Validated {len(locked)} exact backend runtime/test dependency pins.')
          PY

      - name: Compile backend
        run: python -m compileall -q app migrations

      - name: Run backend tests
        run: pytest

      - name: Validate read-only Memos export inventory CLI
        run: |
          python -m app.migration inspect-memos-export tests/fixtures/memos_export_v1.json --json > /tmp/goreecloud-memos-export-report.json
          python -c 'import json; report=json.load(open("/tmp/goreecloud-memos-export-report.json")); assert report["validation"]["metadataValid"] is True; assert report["validation"]["sourceMutationPerformed"] is False; assert report["inventory"]["notes"] == 2; assert report["inventory"]["localAttachmentMetadata"] == 1; assert report["validation"]["attachmentBinaryRecoveryRequired"] is True'

      - name: Validate provider-neutral Memos migration manifest
        run: |
          python -m app.migration build-memos-manifest tests/fixtures/memos_export_v1.json > /tmp/goreecloud-migration-manifest.json
          python -c 'import json; manifest=json.load(open("/tmp/goreecloud-migration-manifest.json")); assert manifest["format"] == "goreecloud-notes-migration"; assert manifest["schemaVersion"] == 1; assert manifest["validation"]["sourceMutationPerformed"] is False; assert manifest["validation"]["targetMutationPerformed"] is False; assert manifest["notes"][0]["attachments"][0]["binary"] == {"status":"required","sha256":None,"verifiedSizeBytes":None}; assert manifest["notes"][1]["lifecycle"]["state"] == "trashed"; assert manifest["notes"][1]["lifecycle"]["restoreTarget"] == "archived"'

      - name: Validate synthetic attachment-binary evidence
        run: |
          mkdir -p /tmp/goreecloud-attachment-evidence-root
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/goreecloud-attachment-evidence-root/fixture.png').write_bytes(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z8XcAAAAASUVORK5CYII='))
          PY
          cat > /tmp/goreecloud-attachment-map.json <<'EOF'
          {
            "format": "goreecloud-notes-attachment-map",
            "schemaVersion": 1,
            "attachments": [
              {"sourceName": "attachments/200", "relativePath": "fixture.png"}
            ]
          }
          EOF
          python -m app.migration verify-attachment-binaries /tmp/goreecloud-migration-manifest.json /tmp/goreecloud-attachment-map.json /tmp/goreecloud-attachment-evidence-root > /tmp/goreecloud-attachment-evidence.json
          python -c 'import json; evidence=json.load(open("/tmp/goreecloud-attachment-evidence.json")); assert evidence["format"] == "goreecloud-notes-attachment-evidence"; assert evidence["verification"]["complete"] is True; assert evidence["verification"]["sourceMutationPerformed"] is False; assert evidence["verification"]["targetMutationPerformed"] is False; assert evidence["attachments"][0]["verifiedSizeBytes"] == 68; assert evidence["attachments"][0]["sha256"] == "489b326e81d3ef516100495b2b2ea91199dafa1f57b7e78bcebddda1bbe36e13"'

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1

      - name: Prepare sanitized CI configuration
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          GOREECLOUD_NOTES_LOGIN_RATE_WINDOW_SECONDS=60
          GOREECLOUD_NOTES_LOGIN_RATE_ACCOUNT_FAILURES=3
          GOREECLOUD_NOTES_LOGIN_RATE_SOURCE_FAILURES=6
          GOREECLOUD_NOTES_LOGIN_RATE_COOLDOWN_SECONDS=2
          GOREECLOUD_NOTES_LOGIN_RATE_STATE_TTL_SECONDS=300
          EOF
          sed -i 's/^GOREECLOUD_NOTES_ATTACHMENT_USER_QUOTA_BYTES=.*/GOREECLOUD_NOTES_ATTACHMENT_USER_QUOTA_BYTES=65536/' .env
          mkdir -p secrets
          printf '%s\n' 'ci-only-postgres-password' > secrets/postgres_password
          sudo chgrp 20001 secrets/postgres_password
          chmod 600 .env
          chmod 640 secrets/postgres_password

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start development stack
        run: docker compose up --detach --build

      - name: Validate database migration round trip
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check
          docker compose run --rm api alembic downgrade base
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check

      - name: Validate live API and PostgreSQL readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready > /tmp/goreecloud-notes-ready.json; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "GoreeCloud Notes did not become ready." >&2
              exit 1
            fi

            sleep 2
          done

          grep -F '"status":"ready"' /tmp/goreecloud-notes-ready.json
          curl --fail --silent --show-error http://127.0.0.1:8000/health | grep -F '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/meta | grep -F '"product":"GoreeCloud Notes"'

      - name: Validate private authentication and CSRF flow
        run: bash scripts/ci_validate_auth.sh

      - name: Validate append-only administrative audit lifecycle
        run: bash scripts/ci_validate_admin_audit.sh

      - name: Validate bounded login abuse controls and proxy boundary
        run: bash scripts/ci_validate_login_security.sh

      - name: Validate organization, ownership, revisions, and note lifecycle
        run: bash scripts/ci_validate_workspace.sh

      - name: Validate owner-scoped internal links and backlinks
        run: bash scripts/ci_validate_note_links.sh

      - name: Validate richer notebook and tag management
        run: bash scripts/ci_validate_organization_management.sh

      - name: Validate PostgreSQL full-text search and isolation
        run: bash scripts/ci_validate_search.sh

      - name: Validate private attachment storage and authorization
        run: bash scripts/ci_validate_attachments.sh

      - name: Validate owner-scoped attachment storage quota
        run: bash scripts/ci_validate_attachment_quota.sh

      - name: Validate read-only attachment storage integrity audit
        run: bash scripts/ci_validate_attachment_integrity.sh

      - name: Validate verified native portable full-library export
        run: bash scripts/ci_validate_portable_export.sh

      - name: Validate authenticated browser portable export
        run: bash scripts/ci_validate_browser_export.sh

      - name: Validate destructive disposable native export and re-import round trip
        run: bash scripts/ci_validate_native_reimport.sh

      - name: Validate disposable native Memos persistence import and equivalence
        run: bash scripts/ci_validate_memos_import.sh

      - name: Validate imported migration provenance survives native export
        run: bash scripts/ci_validate_migration_provenance_export.sh

      - name: Validate disposable database and attachment backup/restore
        run: bash scripts/ci_validate_backup_restore.sh

      - name: Capture Compose diagnostics
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Clean up Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
