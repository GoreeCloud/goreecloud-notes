name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile backend
        run: python -m compileall -q app migrations

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare sanitized CI configuration
        run: |
          cp .env.example .env
          mkdir -p secrets
          printf '%s\n' 'ci-only-postgres-password' > secrets/postgres_password
          sudo chgrp 20001 secrets/postgres_password
          chmod 600 .env
          chmod 640 secrets/postgres_password

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start development stack
        run: docker compose up --detach --build

      - name: Validate database migration round trip
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check
          docker compose run --rm api alembic downgrade base
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check

      - name: Validate live API and PostgreSQL readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready > /tmp/goreecloud-notes-ready.json; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "GoreeCloud Notes did not become ready." >&2
              exit 1
            fi

            sleep 2
          done

          grep -F '"status":"ready"' /tmp/goreecloud-notes-ready.json
          curl --fail --silent --show-error http://127.0.0.1:8000/health | grep -F '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/meta | grep -F '"product":"GoreeCloud Notes"'

      - name: Validate private authentication and CSRF flow
        run: bash scripts/ci_validate_auth.sh

      - name: Validate organization, ownership, revisions, and note lifecycle
        run: bash scripts/ci_validate_workspace.sh

      - name: Capture Compose diagnostics
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Clean up Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
