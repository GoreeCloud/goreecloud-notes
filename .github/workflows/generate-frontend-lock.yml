name: Generate Frontend Lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Resolve package lock from pinned manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile when changed
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Frontend lockfile is already current."
            exit 0
          fi

          git config user.name "GoreeCloud"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: update frontend dependency lock"
          git push origin "HEAD:${{ github.head_ref }}"
