name: Bootstrap frontend lockfile

on:
  push:
    branches:
      - feature/native-foundation

permissions:
  contents: write

concurrency:
  group: frontend-lockfile-bootstrap
  cancel-in-progress: true

jobs:
  lockfile:
    name: Generate reviewed npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/native-foundation

      - name: Stop when lockfile already exists
        id: lockfile
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 24
        if: steps.lockfile.outputs.exists != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Generate npm lockfile
        if: steps.lockfile.outputs.exists != 'true'
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile only
        if: steps.lockfile.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock frontend dependencies"
          git push origin HEAD:feature/native-foundation
